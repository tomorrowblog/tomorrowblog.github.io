<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ponytail 的七级决策梯子</title>
  <desc id="desc">写代码前依次检查是否需要存在、代码库是否已有、标准库、平台原生、已装依赖、一行方案，最后才写最小实现。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11221d"/><stop offset="1" stop-color="#1b332b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="1090" cy="80" r="170" fill="#e65b2f" opacity=".13"/>
  <text x="70" y="72" font-family="Consolas, monospace" font-size="17" letter-spacing="4" fill="#87c7b2">THE DECISION LADDER</text>
  <text x="70" y="136" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="48" font-weight="700" fill="#f7f1e5">写代码前，先爬完这 7 级梯子</text>
  <text x="70" y="176" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#b7c9c2">在理解问题、读完相关代码之后，再选最小的方案。</text>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <g transform="translate(70 220)"><rect width="1060" height="58" rx="14" fill="#f7f1e5"/><circle cx="30" cy="29" r="18" fill="#e65b2f"/><text x="30" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text><text x="68" y="37" font-size="21" font-weight="700" fill="#14231f">这东西真的需要存在吗？</text><text x="1028" y="36" text-anchor="end" font-size="16" fill="#6b7974">不需要就停</text></g>
    <g transform="translate(95 292)"><rect width="1010" height="58" rx="14" fill="#f7f1e5"/><circle cx="30" cy="29" r="18" fill="#e65b2f"/><text x="30" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text><text x="68" y="37" font-size="21" font-weight="700" fill="#14231f">代码库里已经有类似的吗？</text><text x="978" y="36" text-anchor="end" font-size="16" fill="#6b7974">复用</text></g>
    <g transform="translate(120 364)"><rect width="960" height="58" rx="14" fill="#f7f1e5"/><circle cx="30" cy="29" r="18" fill="#e65b2f"/><text x="30" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text><text x="68" y="37" font-size="21" font-weight="700" fill="#14231f">标准库能做吗？</text><text x="928" y="36" text-anchor="end" font-size="16" fill="#6b7974">直接用</text></g>
    <g transform="translate(145 436)"><rect width="910" height="58" rx="14" fill="#f7f1e5"/><circle cx="30" cy="29" r="18" fill="#e65b2f"/><text x="30" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text><text x="68" y="37" font-size="21" font-weight="700" fill="#14231f">平台原生能力能做吗？</text><text x="878" y="36" text-anchor="end" font-size="16" fill="#6b7974">别重造</text></g>
    <g transform="translate(170 508)"><rect width="860" height="58" rx="14" fill="#f7f1e5"/><circle cx="30" cy="29" r="18" fill="#e65b2f"/><text x="30" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">5</text><text x="68" y="37" font-size="21" font-weight="700" fill="#14231f">已安装依赖里已经有吗？</text><text x="828" y="36" text-anchor="end" font-size="16" fill="#6b7974">不要再装</text></g>
    <g transform="translate(195 580)"><rect width="810" height="58" rx="14" fill="#f7f1e5"/><circle cx="30" cy="29" r="18" fill="#e65b2f"/><text x="30" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">6</text><text x="68" y="37" font-size="21" font-weight="700" fill="#14231f">能一行解决吗？</text><text x="778" y="36" text-anchor="end" font-size="16" fill="#6b7974">就写一行</text></g>
    <g transform="translate(220 652)"><rect width="760" height="58" rx="14" fill="#c8e4d7"/><circle cx="30" cy="29" r="18" fill="#1f6f5f"/><text x="30" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">7</text><text x="68" y="37" font-size="21" font-weight="700" fill="#143c31">才允许写最小实现，并给逻辑留一个小测试</text></g>
  </g>
</svg>